<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" role="img" aria-labelledby="title desc">
  <title id="title">A6 detected a changed tool argument</title>
  <desc id="desc">Ollama 0.40.16 with qwen3.5:0.8b returned tool_calls, but the write_file argument changed from type Box&lt;T=any&gt; = { value: T }; to type Box&lt;T name=&quot;any&quot;&gt; = { value: T };.</desc>
  <rect width="880" height="346" rx="20" fill="#0b1120"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="40" y="57" fill="#f8fafc" font-size="32" font-weight="700" letter-spacing="-0.7">The tool call returned changed content</text>
    <text x="40" y="88" fill="#b6c4d8" font-size="19">Ollama 0.40.16 · qwen3.5:0.8b · Check A6</text>
    <rect x="40" y="109" width="800" height="164" rx="12" fill="#131e32" stroke="#364860"/>
    <path d="M60 191H820" stroke="#364860"/>
    <g font-size="17" font-weight="650">
      <text x="64" y="138" fill="#b6c4d8">Expected write_file argument</text>
      <text x="64" y="220" fill="#facc15">Returned write_file argument</text>
    </g>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="27" fill="#f8fafc">
      <text x="64" y="173">type Box<tspan fill="#9fd4ff">&lt;T=any&gt;</tspan> = { value: T };</text>
      <text x="64" y="255">type Box<tspan fill="#facc15">&lt;T name="any"&gt;</tspan> = { value: T };</text>
    </g>
    <circle cx="48" cy="309" r="5" fill="#facc15"/>
    <text x="64" y="315" fill="#b6c4d8" font-size="19">The API still reported <tspan fill="#f8fafc" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">finish_reason: tool_calls</tspan>.</text>
  </g>
</svg>
