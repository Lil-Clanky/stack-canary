<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 338" role="img" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" fill="#f8fafc"><title>How Stack Canary works: new release, isolated runtime, protocol checks, recorded result, matrix and repro</title><rect x="1" y="1" width="998" height="336" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2"/><rect x="22" y="24" width="172" height="176" rx="14" fill="#111a2e" stroke="#27344a" stroke-width="1.5"/><circle cx="52" cy="56" r="14" fill="#facc15"/><text x="52" y="61.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1120">1</text><text x="38" y="102" font-size="17.5" font-weight="700">New release</text><text x="38" y="128" font-size="14" fill="#a3b1c6">Watches the stable</text><text x="38" y="148" font-size="14" fill="#a3b1c6">Ollama releases</text><text x="38" y="168" font-size="14" fill="#a3b1c6">on GitHub.</text><rect x="218" y="24" width="172" height="176" rx="14" fill="#111a2e" stroke="#27344a" stroke-width="1.5"/><circle cx="248" cy="56" r="14" fill="#facc15"/><text x="248" y="61.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1120">2</text><text x="234" y="102" font-size="17.5" font-weight="700">Isolated runtime</text><text x="234" y="128" font-size="14" fill="#a3b1c6">Runs on its own port</text><text x="234" y="148" font-size="14" fill="#a3b1c6">with a clone of the</text><text x="234" y="168" font-size="14" fill="#a3b1c6">model store.</text><path d="M203 105l6 7-6 7" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="24" width="172" height="176" rx="14" fill="#111a2e" stroke="#27344a" stroke-width="1.5"/><circle cx="444" cy="56" r="14" fill="#facc15"/><text x="444" y="61.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1120">3</text><text x="430" y="102" font-size="17.5" font-weight="700">Protocol checks</text><text x="430" y="128" font-size="14" fill="#a3b1c6">Seven small checks,</text><text x="430" y="148" font-size="14" fill="#a3b1c6">three attempts for</text><text x="430" y="168" font-size="14" fill="#a3b1c6">each model.</text><path d="M399 105l6 7-6 7" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="610" y="24" width="172" height="176" rx="14" fill="#111a2e" stroke="#27344a" stroke-width="1.5"/><circle cx="640" cy="56" r="14" fill="#facc15"/><text x="640" y="61.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1120">4</text><text x="626" y="102" font-size="17.5" font-weight="700">Recorded result</text><text x="626" y="128" font-size="14" fill="#a3b1c6">The exact request,</text><text x="626" y="148" font-size="14" fill="#a3b1c6">response and outcome</text><text x="626" y="168" font-size="14" fill="#a3b1c6">for every cell.</text><path d="M595 105l6 7-6 7" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="806" y="24" width="172" height="176" rx="14" fill="#111a2e" stroke="#27344a" stroke-width="1.5"/><circle cx="836" cy="56" r="14" fill="#facc15"/><text x="836" y="61.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#0b1120">5</text><text x="822" y="102" font-size="17.5" font-weight="700">Matrix and repro</text><text x="822" y="128" font-size="14" fill="#a3b1c6">A published matrix,</text><text x="822" y="148" font-size="14" fill="#a3b1c6">a curl replay and</text><text x="822" y="168" font-size="14" fill="#a3b1c6">a notification.</text><path d="M791 105l6 7-6 7" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="222" width="466" height="92" rx="14" fill="none" stroke="#27344a" stroke-width="1.5" stroke-dasharray="5 6"/><text x="40" y="252" font-size="15.5" font-weight="700" fill="#facc15">Memory guard</text><text x="40" y="275" font-size="14" fill="#a3b1c6">Refuses to start under memory pressure.</text><text x="40" y="295" font-size="14" fill="#a3b1c6">A watchdog stops the server in time.</text><rect x="512" y="222" width="466" height="92" rx="14" fill="none" stroke="#27344a" stroke-width="1.5" stroke-dasharray="5 6"/><text x="530" y="252" font-size="15.5" font-weight="700" fill="#facc15">Isolation audit</text><text x="530" y="275" font-size="14" fill="#a3b1c6">Your own Ollama, Hermes config and launchd jobs</text><text x="530" y="295" font-size="14" fill="#a3b1c6">are compared before and after every run.</text></svg>
